<script>(function(){
'use strict';
const M = DATA.meta, O = DATA.overall;
const state = {tab:'__ALL__', q:'', key:'reject', dir:-1, page:1, size:50};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('zh-CN');
const pct = n => Number(n).toFixed(2) + '%';
const rateCls = v => v >= 90 ? 'hi' : (v >= 80 ? 'mid' : 'lo');
function rateBar(v){
  const w = Math.max(0, Math.min(100, v));
  const c = v >= 90 ? '#e84393' : (v >= 80 ? '#f0a0bd' : '#7fd1b9');
  return '<span class="bar"><i style="width:' + w.toFixed(1) + '%;background:' + c + '"></i></span>';
}
function rateCell(v){
  return '<div class="ratecell">' + rateBar(v) +
    '<span class="rv ' + rateCls(v) + '">' + pct(v) + '</span></div>';
}

function renderHead(){
  $('subTitle').textContent = M.window_label + ' · ' + M.industry + ' · ' + M.element_scope;
}
function renderKpis(){
  const items = [
    {lb:'审核提交量级', v:fmt(O.submit), cls:'hl'},
    {lb:'驳量级', v:fmt(O.reject), cls:'warn'},
    {lb:'整体拒绝率', v:pct(O.rate), cls:'warn'},
    {lb:'客户简称数', v:fmt(O.customers), cls:''},
    {lb:'主体明细行数', v:fmt(O.rows), cls:''},
    {lb:'销售数（含未映射）', v:fmt(O.sales), cls:''}
  ];
  $('kpis').innerHTML = items.map(x =>
    '<div class="kpi ' + x.cls + '"><div class="lb">' + x.lb +
    '</div><div class="vl">' + x.v + '</div></div>').join('');
}
function renderNotice(){
  const chips = DATA.tags.map(t => '<span class="tagchip">' + esc(t.name) +
    ' · 提交 ' + fmt(t.submit) + ' / 驳回 ' + fmt(t.reject) + '</span>').join('');
  let h = '<b>标签口径：</b>' + esc(M.tag_scope) + '，共 ' + DATA.tags.length + ' 个审核标签：' + chips;
  h += '<br><b>量级口径：</b>' + esc(M.submit_def) + '；' + esc(M.reject_def) + '；' + esc(M.rate_def) + '。';
  h += '本期合计提交 ' + fmt(O.submit) + '、驳回 ' + fmt(O.reject) +
       '、整体拒绝率 <b>' + pct(O.rate) + '</b>。';
  $('tagNotice').innerHTML = h;
}
function renderTabs(){
  const list = [{sales:'__ALL__', customers:O.customers}].concat(DATA.sales);
  $('tabs').innerHTML = list.map(s => {
    const on = state.tab === s.sales ? ' on' : '';
    const label = s.sales === '__ALL__' ? '全部销售' : s.sales;
    return '<div class="tab' + on + '" data-s="' + esc(s.sales) + '">' + esc(label) +
      '<span class="n">(' + fmt(s.customers) + ')</span></div>';
  }).join('');
  $('tabs').querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => {
    state.tab = el.getAttribute('data-s'); state.page = 1;
    renderTabs(); renderAll();
  }));
}
function renderFootnotes(){
  $('footnotes').innerHTML = '<h3>口径说明</h3><ul>' +
    '<li><b>数据源：</b>' + esc(M.dataset) + '（数据集 3312）；筛选 ' +
      '<code>industry_for_business_three=本土美妆</code>、' +
      '<code>policy_level_3_name=人物名义形象侵权</code>、' +
      '<code>partition_time=' + esc(M.window) + '</code>。</li>' +
    '<li><b>时间窗口：</b>' + esc(M.window_label) + '，' + esc(M.element_scope) + '。</li>' +
    '<li><b>审核提交量级：</b>' + esc(M.submit_def) + '；<b>驳量级：</b>' + esc(M.reject_def) + '。</li>' +
    '<li><b>拒绝率：</b>' + esc(M.rate_def) + '；表格底部「当前筛选合计」按分子分母分别汇总后相除，不是各行拒绝率的平均。</li>' +
    '<li><b>对应销售名称：</b>' + esc(M.sales_def) + '。销售以账户相关人 RTX（英文名）展示，沿用上版审核周报口径。</li>' +
    '<li><b>未映射：</b>「暂无美护对接人」共 ' + fmt(O.unmapped_rows) +
      ' 行（该客户简称未匹配到美护行业中心归属账户），已单独成一个 tab，未做人工补齐或猜测。</li>' +
    '<li><b>唯一性：</b>同一客户简称下所有主体明细行显示同一销售；切换销售 tab 或汇总时不会因多主体重复计数客户数。</li>' +
    '<li><b>质检：</b>明细行合计与数仓总体汇总行完全一致（提交量 ' + fmt(O.submit) +
      '、驳量 ' + fmt(O.reject) + '），无空客户简称、无拒绝率 &gt;100% 的异常行。</li>' +
    '</ul>';
}
function filtered(){
  let rs = DATA.rows;
  if (state.tab !== '__ALL__') rs = rs.filter(r => r.sales === state.tab);
  const q = state.q.trim().toLowerCase();
  if (q) rs = rs.filter(r =>
    r.customer.toLowerCase().indexOf(q) >= 0 ||
    r.subject.toLowerCase().indexOf(q) >= 0 ||
    r.sales.toLowerCase().indexOf(q) >= 0);
  const k = state.key, d = state.dir;
  return rs.slice().sort((a, b) => {
    const x = a[k], y = b[k];
    if (typeof x === 'string' || typeof y === 'string')
      return String(x).localeCompare(String(y), 'zh-CN') * d;
    return (x - y) * d;
  });
}
function renderTable(rs){
  const total = rs.length;
  const pages = Math.max(1, Math.ceil(total / state.size));
  if (state.page > pages) state.page = pages;
  const start = (state.page - 1) * state.size;
  const page = rs.slice(start, start + state.size);
  $('tbody').innerHTML = page.map((r, i) => {
    const none = r.sales === '暂无美护对接人' ? ' class="none"' : '';
    return '<tr>' +
      '<td class="num">' + (start + i + 1) + '</td>' +
      '<td class="cust">' + esc(r.customer) + '</td>' +
      '<td class="subj" title="' + esc(r.subject) + '">' + esc(r.subject) + '</td>' +
      '<td class="num">' + fmt(r.submit) + '</td>' +
      '<td class="num">' + fmt(r.reject) + '</td>' +
      '<td class="num">' + rateCell(r.rate) + '</td>' +
      '<td class="sales"><span' + none + '>' + esc(r.sales) + '</span></td>' +
      '</tr>';
  }).join('');
  let s = 0, j = 0;
  rs.forEach(r => { s += r.submit; j += r.reject; });
  const rate = s > 0 ? j / s * 100 : 0;
  const cust = new Set(rs.map(r => r.customer)).size;
  const label = state.tab === '__ALL__' ? '全部销售' : state.tab;
  $('tfoot').innerHTML = '<tr>' +
    '<td colspan="3">当前筛选合计 · ' + esc(label) + '（' + fmt(cust) +
      ' 个客户简称 / ' + fmt(total) + ' 行主体明细）</td>' +
    '<td class="num">' + fmt(s) + '</td>' +
    '<td class="num">' + fmt(j) + '</td>' +
    '<td class="num">' + rateCell(rate) + '</td>' +
    '<td></td></tr>';
  $('cnt').textContent = '共 ' + fmt(total) + ' 行主体明细 / ' + fmt(cust) + ' 个客户简称';
  return pages;
}
function renderPager(pages){
  if (pages <= 1) { $('pager').innerHTML = ''; return; }
  const cur = state.page, out = [];
  const add = (t, p, on, dis) => out.push('<button class="pg' + (on ? ' on' : '') +
    '" data-p="' + p + '"' + (dis ? ' disabled' : '') + '>' + t + '</button>');
  add('首页', 1, false, false);
  add('上一页', Math.max(1, cur - 1), false, cur === 1);
  let lo = Math.max(1, cur - 2), hi = Math.min(pages, lo + 4);
  lo = Math.max(1, hi - 4);
  for (let p = lo; p <= hi; p++) add(String(p), p, p === cur, false);
  add('下一页', Math.min(pages, cur + 1), false, cur === pages);
  add('末页', pages, false, false);
  out.push('<span class="pinfo">第 ' + cur + ' / ' + pages + ' 页</span>');
  $('pager').innerHTML = out.join('');
  $('pager').querySelectorAll('.pg').forEach(el => el.addEventListener('click', () => {
    state.page = Number(el.getAttribute('data-p')); renderAll();
    document.querySelector('.table-box').scrollTop = 0;
  }));
}
function renderSortArrow(){
  document.querySelectorAll('#tbl thead th').forEach(th => {
    const k = th.getAttribute('data-k');
    let ar = th.querySelector('.ar');
    if (k === state.key) {
      if (!ar) { ar = document.createElement('span'); ar.className = 'ar'; th.appendChild(ar); }
      ar.textContent = state.dir === -1 ? '▼' : '▲';
    } else if (ar) { ar.remove(); }
  });
}
function renderAll(){
  const rs = filtered();
  const pages = renderTable(rs);
  renderPager(pages);
  renderSortArrow();
}
function exportCsv(){
  const rs = filtered();
  const head = ['客户简称','主体明细','审核提交量级','驳量级','拒绝率(%)','对应销售名称'];
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const lines = [head.map(q).join(',')].concat(rs.map(r =>
    [r.customer, r.subject, r.submit, r.reject, r.rate.toFixed(2), r.sales].map(q).join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '本土美妆_人物名义形象侵权_近双周_' +
    (state.tab === '__ALL__' ? '全部销售' : state.tab) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
$('q').addEventListener('input', e => { state.q = e.target.value; state.page = 1; renderAll(); });
$('pagesize').addEventListener('change', e => {
  state.size = Number(e.target.value); state.page = 1; renderAll(); });
$('btnExport').addEventListener('click', exportCsv);
document.querySelectorAll('#tbl thead th').forEach(th => th.addEventListener('click', () => {
  const k = th.getAttribute('data-k');
  if (k === 'idx') return;
  if (state.key === k) state.dir = -state.dir;
  else { state.key = k; state.dir = -1; }
  state.page = 1; renderAll();
}));
